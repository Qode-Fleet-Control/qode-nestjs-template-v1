# fleet.conf — app manifest. Sourced (as shell) by the lifecycle scripts
# (./run ./start ./restart ./reload ./stop). Language-agnostic: fill in the
# commands for YOUR stack. `$PORT` and `$BASE_PATH` are available inside every
# command. Leave a command empty ("") to skip that step.

NAME="fleet-nestjs-app"      # shown in logs
PORT="3000"                  # default port; the fleet overrides via injected $PORT
HEALTH_PATH='$BASE_PATH/health'  # path that returns 200 once the app is ready ($BASE_PATH expands at runtime)

# --- lifecycle commands (fill in for your stack; see README for examples) ---
# SINGLE-QUOTE any command that uses $PORT or $BASE_PATH, so they expand when
# the command RUNS (with the fleet-injected values), not when this file is read.
INSTALL_CMD='npm ci --include=dev'                       # install deps incl. dev (NODE_ENV=production omits @nestjs/cli otherwise)
BUILD_CMD='npm run build'                                # compile TS -> dist/
# The lifecycle scripts run these from bin/, so serve node via an npm script
# (npm runs scripts from the package root) rather than a cwd-relative path.
# start:prod is `node dist/main.js`; it listens on $PORT / 0.0.0.0 (see main.ts).
START_CMD='npm run migration:run && npm run start:prod'  # migrate, then serve on $PORT
RELOAD_CMD=''                # optional: apply new config without a rebuild
                             # (empty => ./reload falls back to a no-build stop+start)
