# fleet.conf — app manifest. Sourced (as shell) by the lifecycle scripts
# (./run ./start ./restart ./reload ./stop). Language-agnostic: fill in the
# commands for YOUR stack. `$PORT` is available inside every command.
# Leave a command empty ("") to skip that step.

NAME='NestJS Template'        # shown in logs
PORT="3000"                # default port; the fleet overrides via injected $PORT
HEALTH_PATH="/health"            # VERSION_NEUTRAL route

# --- lifecycle commands (fill in for your stack; see README for examples) ---
# SINGLE-QUOTE any command that uses $PORT, so it expands when the command
# RUNS (with the fleet-injected value), not when this file is read.
INSTALL_CMD='npm ci'
BUILD_CMD='npm run build'
START_CMD='env PORT="$PORT" node dist/main.js'
RELOAD_CMD=''              # optional: apply new config without a rebuild
                           # (empty => ./reload falls back to a no-build stop+start)
